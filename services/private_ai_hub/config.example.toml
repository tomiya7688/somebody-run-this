[server]
host = "127.0.0.1"
port = 8787
request_timeout_seconds = 10
max_connections = 64

[storage]
sqlite_path = "./data/private_ai_hub.sqlite3"

[auth]
session_ttl_seconds = 43200
login_attempts_per_minute = 10

[network]
# offline: no application-managed outbound network capability
# restricted-egress: only explicit EgressBroker policies may connect outward
profile = "offline"

[audit]
security_enabled = true
conversation_enabled = false
store_prompt_content = false
store_response_content = false
retention_days = 180
max_metadata_bytes = 16384
max_content_bytes = 1048576
