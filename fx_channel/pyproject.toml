[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-channel"
version = "0.1.0"
description = "A no-real-money FX social game backend."
requires-python = ">=3.14.10,<3.15"
dependencies = [
  "FastAPI>=0.162.0,<0.163",
  "PyYAML>=6.0.3,<7",
  "uvicorn>=0.54.0,<0.55"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<0.29",
  "pytest>=9.2.0,<10"
]

[project.scripts]
fx-channel-server = "fx_channel.server_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C90"]
ignore = ["B008"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.coverage.run]
branch = true
source = ["fx_channel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
