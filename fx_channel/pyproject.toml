[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-channel"
version = "0.1.0"
description = "A no-real-money FX social game with pluggable market price providers."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0"
]

[project.scripts]
fx-channel-server = "fx_channel.server_main:main"
fx-channel-user = "fx_channel.user_main:main"
fx-channel-operator = "fx_channel.operator_main:main"

[tool.setuptools.packages.find]
where = ["src"]
