[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-channel"
version = "0.1.0"
description = "A no-real-money FX social game backend."
requires-python = ">=3.11"
dependencies = [
  "FastAPI>=0.110",
  "PyYAML>=6.0",
  "uvicorn>=0.29"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0"
]

[project.scripts]
fx-channel-server = "fx_channel.server_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
