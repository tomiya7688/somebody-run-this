# fx_channel official distribution targets

user:
  windows_x64:
    framework: flutter
    os: windows
    architecture: x86_64
    minimum_os: "Windows 10"
    entrypoint: "fx_channel_user.exe"
    artifact: "fx-channel-user-windows-x64.zip"
    status: target

  android_arm64:
    framework: flutter
    os: android
    architecture: arm64-v8a
    minimum_os: "Android 9.0"
    minimum_api_level: 28
    artifact: "fx-channel-user-android-arm64.apk"
    status: target

  web:
    framework: flutter
    os: web
    architecture: wasm_or_js
    artifact: "fx-channel-user-web.zip"
    server_mount: "/play/"
    status: target

operator:
  windows_x64:
    framework: flutter
    os: windows
    architecture: x86_64
    entrypoint: "fx_channel_operator.exe"
    artifact: "fx-channel-operator-windows-x64.zip"
    status: target

  linux_x64:
    framework: flutter
    os: linux
    architecture: x86_64
    artifact: "fx-channel-operator-linux-x64.tar.gz"
    status: target

server:
  linux_x64:
    language: python
    framework: fastapi
    os: linux
    architecture: x86_64
    intended_for:
      - "Ubuntu Server"
      - "Debian"
      - "compatible glibc-based Linux"
    artifact: "fx-channel-server-linux-x64.tar.gz"
    status: target

  linux_arm64:
    language: python
    framework: fastapi
    os: linux
    architecture: aarch64
    intended_for:
      - "Ubuntu Server ARM64"
      - "Debian ARM64"
      - "compatible glibc-based Linux ARM64"
    artifact: "fx-channel-server-linux-arm64.tar.gz"
    status: target

  windows_x64:
    language: python
    framework: fastapi
    os: windows
    architecture: x86_64
    intended_for:
      - "Windows Server"
      - "Windows 10/11 for small/self-hosted operation"
    artifact: "fx-channel-server-windows-x64.zip"
    status: target
