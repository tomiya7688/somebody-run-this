# ============================================================
# fx_channel 開発者向け設定
# ============================================================
#
# 運営設定(operator.yaml)とは別物です。
# GUI実装・テーマ・開発時の表示方法など、開発者が差し替える項目だけを置きます。
#
# このファイルを developer.yaml にコピーして利用できます。
# ============================================================

frontend:
  # GUI実装のPython entrypoint。
  # "module.path:ClassName" 形式。
  #
  # 別GUIに差し替える場合は、基本的にここだけ変更します。
  entrypoint: "fx_channel.frontends.jp_soft_pop:Frontend"

  # GUIへ渡す見た目側の設定。
  options:
    theme: "jp_soft_pop"
    locale: "ja-JP"
