# ============================================================
# fx_channel 運営設定
# ============================================================

server:
  host: "127.0.0.1"
  port: 8787

  # Operator API Bearer Tokenを格納する環境変数名
  operator_token_env: "FX_CHANNEL_OPERATOR_TOKEN"

  # Flutter Webを別ドメインでホストする場合のみ許可元を列挙
  # 同一サーバーの /play/ から配信する場合は空で構いません
  cors_origins: []

  # 同梱Flutter Webの公開パス
  user_web_route: "/play"

storage:
  # 標準はSQLite。追加DBサーバー不要で、1ファイルをバックアップできます。
  type: sqlite
  sqlite:
    path: "data/fx_channel.db"

market:
  # simulated または real
  mode: simulated

  simulated:
    seed: null
    tick_seconds: 5
    default_start_price: 100.0
    base_volatility: 0.001
    drift: 0.0

  real:
    provider: generic_http
    endpoint: "https://example.com/api/rates"
    api_key_env: "FX_CHANNEL_API_KEY"
    api_key_header: "X-API-Key"
    poll_seconds: 10
    timeout_seconds: 5
    on_error: keep_last

symbols:
  - USDJPY
  - EURUSD
  - GBPUSD

game:
  starting_balance: 1000000
  max_leverage: 25
  allow_negative_balance: false

economy:
  # 有償想定通貨は初期0。購入処理や運営付与から増やします。
  starting_currencies:
    premium_gem: 0

  # 新規プレイヤーに最低1キャラを持たせる例
  starting_characters:
    - rookie_aki

season:
  # falseにすると常設シーズン扱い
  enabled: true

  # UTC基準。期間終了後の最初のアクセスで自動的に次シーズンへ移行
  duration_days: 7

  # true: 新シーズンでFX残高/ポジションを初期化
  # キャラ・ガチャ通貨・スキル状態は保持
  reset_balance: true

  # 将来の実績システム用。現時点で実績自体は未実装
  keep_achievements: true
