name: Test

on:
  push:
    paths:
      - "fx_channel/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "fx_channel/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fx_channel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m fx_channel.content_validate --content content

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze user app
        working-directory: fx_channel/clients/user_app
        run: |
          flutter pub get
          flutter analyze
      - name: Analyze operator app
        working-directory: fx_channel/clients/operator_app
        run: |
          flutter pub get
          flutter analyze
