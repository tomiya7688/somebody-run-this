name: Release fx_channel

on:
  push:
    tags:
      - "fx-channel-v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  user:
    needs: test
    uses: ./.github/workflows/build-user-app.yml

  operator:
    needs: test
    uses: ./.github/workflows/build-operator-app.yml

  server:
    needs: test
    uses: ./.github/workflows/build-server.yml

  release:
    needs:
      - user
      - operator
      - server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Collect files and checksums
        run: |
          mkdir -p release-files
          find release-artifacts -type f -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          ls -lah

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-files/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
