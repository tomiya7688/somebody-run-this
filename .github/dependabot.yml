version: 2
updates:
  - package-ecosystem: pip
    directory: /fx_channel
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security-review

  - package-ecosystem: pub
    directory: /fx_channel/clients/user_app
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security-review

  - package-ecosystem: pub
    directory: /fx_channel/clients/operator_app
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security-review

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security-review
